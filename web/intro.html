<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conntext 인트로</title>
<link rel="icon" href="/assets/brand/candidates/mark-a.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #f4f7fa; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  .replay { position: fixed; right: 20px; bottom: 16px; font: 500 14px/1 system-ui, sans-serif; color: #4a5873;
            background: none; border: 1px solid #c9cfd9; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  .replay:hover { color: #101a2d; border-color: #4a5873; }
  .replay:focus-visible { outline: 2px solid #145ec1; outline-offset: 2px; }
  body.capture .replay { display: none; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="conntext 워드마크의 노란 conn 라벨이 nn만 품은 채 줄어들어, 노치가 있는 라벨 태그 아이콘이 되는 인트로">
  <rect width="1920" height="1080" fill="#f4f7fa"/>
  <rect id="tile" fill="#101a2d"/>
  <path id="label" fill="#f7d22a"/>
  <g id="glyphs" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
  <g id="lock" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
</svg>
<button class="replay" type="button" id="replay">다시 보기</button>
<script>
// 워드마크(wordmark.svg)의 라벨과 글자. 워드마크 단위.
const WM = {
  label: { x: 0, y: -15, w: 210.5, h: 66, r: 9 },
  conn: [
    [18.25, 'M30.95 5.5A18 18 0 1 0 30.95 30.5'],
    [67.25, 'M18 0A18 18 0 1 1 18 36A18 18 0 1 1 18 0Z'],
    [117.25, 'M0 36V15A15 15 0 0 1 30 15V36'],
    [163.25, 'M0 36V15A15 15 0 0 1 30 15V36'],
  ],
  text: [
    [223.75, 'M7 -13V25A11 11 0 0 0 18 36H19M0 0H18'],
    [254.75, 'M0 18H36A18 18 0 1 0 31.38 30.04'],
    [304.25, 'M0 0L28 36M28 0L0 36'],
    [345.75, 'M7 -13V25A11 11 0 0 0 18 36H19M0 0H18'],
  ],
};
// 후보 A(mark-a.svg). 아이콘 단위 64.
const A = {
  tag: { x: 6, y: 14, w: 52, h: 36, rl: 4.5, rr: 0, notch: 9 },
  n1: 'M12.5 40.5V30A5.5 5.5 0 0 1 23.5 30V40.5',
  n2: 'M30.5 40.5V30A5.5 5.5 0 0 1 41.5 30V40.5',
  stroke: 5.5,
};
const C = { ink: '#101a2d', yellow: '#f7d22a' };
const DUR = 6.0;
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

// 라벨 모양: 왼쪽 모서리 둥금(rl), 오른쪽 모서리 둥금(rr), 오른쪽 V자 노치 깊이(notch).
// 워드마크 라벨(노치 0, 네 모서리 둥금)과 A의 태그(노치 9, 오른쪽 모서리 각짐)를 같은 식으로 그려 모핑한다.
function labelPath({ x, y, w, h, rl, rr, notch }) {
  const R = x + w, B = y + h;
  return `M${x + rl} ${y}H${R - rr}A${rr} ${rr} 0 0 1 ${R} ${y + rr}` +
         `L${R - notch} ${y + h / 2}L${R} ${B - rr}A${rr} ${rr} 0 0 1 ${R - rr} ${B}` +
         `H${x + rl}A${rl} ${rl} 0 0 1 ${x} ${B - rl}V${y + rl}A${rl} ${rl} 0 0 1 ${x + rl} ${y}Z`;
}
const lerpShape = (a, b, p) => Object.fromEntries(Object.keys(a).map((k) => [k, lerp(a[k], b[k], p)]));

const probe = document.createElementNS(NS, 'path');
probe.setAttribute('visibility', 'hidden');
$('stage').appendChild(probe);
const lengthOf = (d) => { probe.setAttribute('d', d); return probe.getTotalLength(); };
function sample(d, n = 72) {
  probe.setAttribute('d', d);
  const L = probe.getTotalLength();
  return Array.from({ length: n }, (_, i) => { const p = probe.getPointAtLength((L * i) / (n - 1)); return [p.x, p.y]; });
}
const toD = (pts) => 'M' + pts.map((p) => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L');

// 화면 배치
const S1 = 3, X1 = (1920 - 370 * S1) / 2, Y1 = 540 - 18 * S1;         // 처음 워드마크
const K = 440 / 64, IX = 960 - 220, IY = 540 - 220;                    // 큰 아이콘
const LK = 132, LS = 1.62, GAP = 48;                                   // 마지막 잠금 배치
const LW = LK + GAP + 370 * LS, LX = (1920 - LW) / 2;
const LIX = LX, LIY = 540 - LK / 2, LWX = LX + LK + GAP, LWY = 540 - 18 * LS;

const nWM = sample(WM.conn[2][1]);
const nA = [sample(A.n1), sample(A.n2)];

function makeGlyphs(parent, list) {
  return list.map(([dx, d]) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.dataset.dx = dx;
    p._len = lengthOf(d);
    parent.appendChild(p);
    return p;
  });
}
const connEls = makeGlyphs($('glyphs'), WM.conn);
const textEls = makeGlyphs($('glyphs'), WM.text);
const lock = $('lock');
const lockLabel = document.createElementNS(NS, 'rect');
lockLabel.setAttribute('fill', C.yellow);
lock.appendChild(lockLabel);
const lockConn = makeGlyphs(lock, WM.conn);
const lockText = makeGlyphs(lock, WM.text);

function place(el, dx, sx, sy, s, color, draw = 1, op = 1) {
  el.setAttribute('transform', `translate(${sx + s * dx} ${sy}) scale(${s})`);
  el.setAttribute('stroke-width', 6.5);
  el.setAttribute('stroke', color);
  el.setAttribute('stroke-dasharray', el._len);
  el.setAttribute('stroke-dashoffset', el._len * (1 - draw));
  el.setAttribute('opacity', op);
}

function render(t) {
  // 1) 워드마크가 그려진다 0.0–1.2
  const aLab = outC(seg(t, 0.05, 0.55));
  const aConn = (i) => inOut(seg(t, 0.2 + i * 0.08, 0.75 + i * 0.08));
  const aText = (i) => inOut(seg(t, 0.45 + i * 0.07, 1.0 + i * 0.07));
  // 2) c, o, text가 빠진다 1.5–2.1
  const out = inOut(seg(t, 1.5, 2.1));
  // 3) 라벨이 nn만 품은 채 줄어들며 노치가 생긴다 1.8–2.8
  const mo = inOut(seg(t, 1.8, 2.8));
  // 4) 잉크 칸이 태그 뒤에서 펼쳐진다 2.55–3.25
  const tl = outC(seg(t, 2.55, 3.25));
  // 5) 아이콘이 왼쪽으로 물러나고 워드마크가 옆에 놓인다
  const lk = inOut(seg(t, 4.0, 4.75));
  const lkIn = outC(seg(t, 4.55, 5.15));

  // 큰 아이콘 → 잠금 아이콘
  const ik = lerp(K, LK / 64, lk), ix = lerp(IX, LIX, lk), iy = lerp(IY, LIY, lk);
  const toScreen = (x, y) => [ix + ik * x, iy + ik * y];

  // 라벨
  const L = WM.label;
  const from = { x: X1 + S1 * L.x, y: Y1 + S1 * L.y, w: S1 * L.w * aLab, h: S1 * L.h, rl: S1 * L.r, rr: Math.min(S1 * L.r, S1 * L.w * aLab / 2), notch: 0 };
  const [tx, ty] = toScreen(A.tag.x, A.tag.y);
  const to = { x: tx, y: ty, w: ik * A.tag.w, h: ik * A.tag.h, rl: ik * A.tag.rl, rr: 0, notch: ik * A.tag.notch };
  $('label').setAttribute('d', labelPath(lerpShape(from, to, mo)));
  $('label').setAttribute('opacity', aLab > 0 ? 1 : 0);

  // 잉크 칸: 태그 크기에서 시작해 64 칸으로 펼쳐진다
  const tile = $('tile');
  const t0 = { x: to.x, y: to.y, w: to.w, h: to.h, r: to.rl };
  const t1 = { x: ix, y: iy, w: 64 * ik, h: 64 * ik, r: 14 * ik };
  tile.setAttribute('x', lerp(t0.x, t1.x, tl)); tile.setAttribute('y', lerp(t0.y, t1.y, tl));
  tile.setAttribute('width', lerp(t0.w, t1.w, tl)); tile.setAttribute('height', lerp(t0.h, t1.h, tl));
  tile.setAttribute('rx', lerp(t0.r, t1.r, tl));
  tile.setAttribute('opacity', tl > 0 ? 1 : 0);

  // c, o는 왼쪽으로, text는 오른쪽으로 빠진다
  connEls.slice(0, 2).forEach((el, i) => place(el, +el.dataset.dx, X1 - 60 * out, Y1, S1, C.ink, aConn(i), 1 - out));
  textEls.forEach((el, i) => place(el, +el.dataset.dx, X1 + 60 * out, Y1, S1, C.ink, aText(i), 1 - out));

  // n 두 개: 워드마크 자리 → A의 자리
  connEls.slice(2).forEach((el, j) => {
    const dx = +el.dataset.dx;
    if (mo <= 0) {
      el.setAttribute('d', WM.conn[2 + j][1]);
      place(el, dx, X1, Y1, S1, C.ink, aConn(2 + j), 1);
      return;
    }
    const pts = nWM.map(([x, y], i) => {
      const a = [X1 + S1 * (dx + x), Y1 + S1 * y];
      const b = toScreen(...nA[j][i]);
      return [lerp(a[0], b[0], mo), lerp(a[1], b[1], mo)];
    });
    el.setAttribute('d', toD(pts));
    el.removeAttribute('transform');
    el.removeAttribute('stroke-dasharray');
    el.removeAttribute('stroke-dashoffset');
    el.setAttribute('stroke-width', lerp(6.5 * S1, A.stroke * ik, mo));
    el.setAttribute('stroke', C.ink);
    el.setAttribute('opacity', 1);
  });

  // 잠금 배치의 워드마크
  lock.setAttribute('opacity', lkIn);
  lock.setAttribute('transform', `translate(${(1 - lkIn) * 40} 0)`);
  lockLabel.setAttribute('x', LWX + LS * L.x); lockLabel.setAttribute('y', LWY + LS * L.y);
  lockLabel.setAttribute('width', LS * L.w); lockLabel.setAttribute('height', LS * L.h); lockLabel.setAttribute('rx', LS * L.r);
  lockConn.forEach((el) => place(el, +el.dataset.dx, LWX, LWY, LS, C.ink));
  lockText.forEach((el) => place(el, +el.dataset.dx, LWX, LWY, LS, C.ink));
}

window.render = render;
window.DURATION = DUR;
if (new URLSearchParams(location.search).has('capture')) {
  document.body.classList.add('capture');
  render(0);
} else {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0 = null;
  const tick = (now) => { if (t0 === null) t0 = now; const t = (now - t0) / 1000; render(Math.min(t, DUR)); if (t < DUR) requestAnimationFrame(tick); };
  const play = () => { t0 = null; requestAnimationFrame(tick); };
  if (reduce) render(DUR); else play();
  $('replay').addEventListener('click', () => (reduce ? render(DUR) : play()));
}
</script>
</body>
</html>
