<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conntext 인트로</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #f4f7fa; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  .replay { position: fixed; right: 20px; bottom: 16px; font: 500 14px/1 system-ui, sans-serif; color: #4a5873;
            background: none; border: 1px solid #c9cfd9; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  .replay:hover { color: #101a2d; border-color: #4a5873; }
  .replay:focus-visible { outline: 2px solid #145ec1; outline-offset: 2px; }
  body.capture .replay { display: none; }
</style>
</head>
<body>
<svg id="stage" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="conntext 워드마크의 노란 conn 라벨이 nn만 품은 채 줄어들어, 노치가 있는 라벨 태그 심볼이 되는 인트로"></svg>
<button class="replay" type="button" id="replay">다시 보기</button>
<script type="module">
import { mountIntro, play } from "/assets/intro.js"
const intro = mountIntro(document.getElementById("stage"))
window.render = intro.render
window.DURATION = intro.duration
if (new URLSearchParams(location.search).has("capture")) {
  document.body.classList.add("capture")
  intro.render(0)
  window.introReady = true
} else {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches
  const go = () => (reduce ? intro.render(intro.duration) : play(intro.render))
  go()
  document.getElementById("replay").addEventListener("click", go)
}
</script>
</body>
</html>
